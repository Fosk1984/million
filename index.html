<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Who Wants to Be a Millionaire — Shoulder Pathology</title>
<meta name="description" content="A Millionaire-style quiz focused on shoulder pathology." />
<link rel="icon" href="data:,"><!-- silence favicon 404 -->
<style>
  :root{
    --bg:#0b0f1a; --card:#12172a; --ink:#eaf0ff; --muted:#a8b2cc;
    --acc:#6ac2ff; --acc2:#ffd36a; --good:#33d17a; --bad:#ff6b6b; --edge:#2a3567;
    --glow:0 8px 30px rgba(106,194,255,.25);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background: radial-gradient(1200px 700px at 70% -20%, #142043 0%, #0b0f1a 60%) fixed, var(--bg);
    color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    line-height:1.4;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:16px;}
  header{display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:12px}
  .brand{display:flex; align-items:center; gap:12px}
  .coin{
    width:42px; height:42px; border-radius:50%; background: radial-gradient(circle at 30% 30%, #ffeaa3, #f2b705 60%, #9a6a00);
    box-shadow: inset 0 0 6px rgba(0,0,0,.5), 0 4px 18px rgba(255,211,106,.25);
  }
  .title{font-weight:800; letter-spacing:.3px}
  .lifelines{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  button,.btn{
    background: linear-gradient(180deg, #1e2760, #152053);
    border:1px solid #243073; color:var(--ink);
    padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700;
    box-shadow: var(--glow); transition: transform .1s ease, box-shadow .2s ease, opacity .2s ease;
  }
  button:hover{transform: translateY(-1px)}
  button:disabled{opacity:.45; cursor:not-allowed}
  .pill{font-size:.9rem}
  .layout{display:grid; grid-template-columns: 1fr 280px; gap:16px; align-items:start}
  @media (max-width: 960px){ .layout{grid-template-columns:1fr} .ladder{order:-1} }
  .card{
    background: linear-gradient(180deg, #12172a, #0f1426);
    border:1px solid var(--edge); border-radius:16px; padding:14px; box-shadow: var(--glow);
  }
  .question{font-size: clamp(1rem, 2.6vw, 1.2rem); font-weight:700; margin:4px 0 12px}
  .q-meta{color:var(--muted); font-size:.9rem; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .q-image{max-width:100%; border-radius:12px; border:1px solid var(--edge); margin:8px 0 4px; display:none}
  .answers{display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px}
  @media (max-width:640px){ .answers{grid-template-columns:1fr} }
  .ans{
    display:flex; align-items:center; gap:10px; padding:12px; border:1px solid #2a3567; border-radius:12px;
    background: linear-gradient(180deg, #0f1738, #0c132f); font-weight:700; position:relative; overflow:hidden;
  }
  .ans .label{opacity:.9; color:#9eb4ff}
  .ans[data-selected="true"]{
    outline:2px solid #6ac2ff;
    box-shadow: 0 0 0 3px rgba(106,194,255,.25);
    background: linear-gradient(180deg, #14204a, #0f183d);
    border-color:#3350a8;
  }
  .ans.correct{outline:2px solid var(--good); box-shadow: 0 0 0 3px rgba(51,209,122,.3)}
  .ans.wrong{outline:2px solid var(--bad); box-shadow: 0 0 0 3px rgba(255,107,107,.25)}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
  .muted{color:var(--muted)}
  .ladder{position:sticky; top:12px}
  .ladder ol{display:flex; flex-direction:column-reverse; padding:0; margin:0; list-style:none}
  .ladder li{display:flex; justify-content:space-between; padding:4px 6px; border-radius:8px; margin-bottom:2px; border:1px solid transparent}
  .ladder .active{border-color:var(--acc2); outline:2px solid rgba(255,211,106,.35); background: linear-gradient(180deg, #1c2450, #10183f)}
  .ladder .safe{color:#ffe39a}
  .timer{
    min-width:60px; text-align:center; font-weight:800; border-radius:10px; padding:8px 10px;
    border:1px solid #2a3567; background:linear-gradient(180deg,#0e1535,#0b112b)
  }
  .explain{margin-top:10px; padding:10px; border-radius:12px; border:1px solid #2a3567; background:#0c1430}
  .footer{margin-top:14px; color:var(--muted); font-size:.85rem}
  .hidden{display:none !important}
  .chip{padding:3px 8px; border-radius:999px; border:1px solid #2a3567; background:#0f1738; font-weight:700; font-size:.78rem}
  .ok{color:#c1ffd6} .bad{color:#ffc1c1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="coin" aria-hidden="true"></div>
      <div>
        <div class="title">Who Wants to Be a Millionaire — <span style="color:#9dd2ff">Shoulder Pathology</span></div>
        <div class="muted" style="font-size:.9rem">Educational practice mode • <span id="modeLabel">Timer: On</span></div>
      </div>
    </div>
    <div class="lifelines">
      <button id="ll5050" class="pill">50:50</button>
      <button id="llCrowd" class="pill">Ask the Crowd</button>
      <button id="llExpert" class="pill">Ask an Expert</button>
      <span class="timer" id="timer">45s</span>
      <button id="btnRules" class="pill">?</button>
      <button id="btnScores" class="pill">🏆</button>
      <button id="btnSound" class="pill">🔊</button>
    </div>
  </header>

  <div class="layout">
    <main class="card">
      <img id="qImg" class="q-image" alt="">
      <div class="q-meta"><span id="qTopic" class="chip">Topic</span><span id="qLevel" class="chip">Q1</span></div>
      <div id="question" class="question">Press Start to begin.</div>
      <div class="answers" id="answers"></div>
      <div class="actions">
        <button id="btnStart">Start Game</button>
        <button id="btnFinal" class="hidden">Final Answer</button>
        <button id="btnNext" class="hidden">Next Question</button>
        <button id="btnQuit" class="hidden">Walk Away</button>
      </div>
      <div id="explain" class="explain hidden"></div>
    </main>

    <aside class="card ladder">
      <h3>Prize Ladder</h3>
      <ol id="ladder"></ol>
    </aside>
  </div>
</div>

<!-- ====== AUDIO ====== -->
<audio id="snd-intro"    src="sounds/intro.mp3" preload="auto" loop></audio>
<audio id="snd-question" src="sounds/question-music.mp3" preload="auto" loop></audio>
<audio id="snd-final"    src="sounds/final.mp3" preload="auto"></audio>
<audio id="snd-correct"  src="sounds/correct.mp3" preload="auto"></audio>
<audio id="snd-wrong"    src="sounds/wrong.mp3" preload="auto"></audio>
<audio id="snd-5050"     src="sounds/lifeline5050.mp3" preload="auto"></audio>
<audio id="snd-crowd"    src="sounds/lifelineCrowd.mp3" preload="auto"></audio>
<audio id="snd-expert"   src="sounds/lifelineExpert.mp3" preload="auto"></audio>

<script>
const MONEY = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];

const ladderEl = document.getElementById("ladder");
function renderLadder(){
  ladderEl.innerHTML = "";
  MONEY.forEach((m, idx)=>{
    const li = document.createElement("li");
    const n = idx+1; // ✅ Q1–Q15
    li.innerHTML = `<span>#${n}</span> <span>£${m.toLocaleString()}</span>`;
    ladderEl.appendChild(li);
  });
}
renderLadder();

// ==== AUDIO HANDLING ====
const sounds = {
  intro: document.getElementById("snd-intro"),
  question: document.getElementById("snd-question"),
  final: document.getElementById("snd-final"),
  correct: document.getElementById("snd-correct"),
  wrong: document.getElementById("snd-wrong"),
  ll5050: document.getElementById("snd-5050"),
  llCrowd: document.getElementById("snd-crowd"),
  llExpert: document.getElementById("snd-expert")
};

function stopAll(){
  Object.values(sounds).forEach(s=>{
    s.pause();
    s.currentTime=0;
  });
}
function playSound(name){
  stopAll();
  if(sounds[name]) sounds[name].play().catch(()=>{});
}

// ==== DEMO GAME LOGIC ====
document.getElementById("btnStart").addEventListener("click",()=>{
  playSound("question"); // start with Q music
});
document.getElementById("btnNext").addEventListener("click",()=>{
  playSound("question");
});
// Wrong answer demo
function wrongAnswer(){
  stopAll();
  sounds.wrong.play().catch(()=>{});
  setTimeout(()=>{ alert("Game Over"); }, 3000); // let sound finish
}
</script>
</body>
</html>
