<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launch</title>
  <meta name="description" content="Minimal landing page with a fullscreen background and a centered Play button." />
  <link rel="icon" href="data:,"><!-- avoid 404 on GitHub Pages -->
  <style>
    :root{
      --bg-url: url('./images/Backgroundmil.png');
      --ink: #ffffff;
      --ink-dim: rgba(255,255,255,.8);
      --shadow: rgba(0,0,0,.5);
      --shadow-strong: rgba(0,0,0,.65);
      --accent: #6ac2ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{
      margin:0; font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--ink);
      background:#000;
    }

    /* Fullscreen background */
.stage{
  position:relative;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  isolation:isolate;
}

.center{
  display:grid;
  gap:1rem;
  place-items:center;
  text-align:center;
  padding:2rem;
  filter: drop-shadow(0 10px 30px var(--shadow));
}
    /* Play button */
    .play-btn{
      -webkit-tap-highlight-color: transparent;
      appearance:none; text-decoration:none; border:0; cursor:pointer;
      width: 140px; height: 140px; border-radius: 999px;
      display:grid; place-items:center;
      background: linear-gradient(180deg, var(--shadow-strong), rgba(0,0,0,.2));
      backdrop-filter: blur(6px) saturate(140%);
      box-shadow:
        0 10px 25px rgba(0,0,0,.45),
        inset 0 0 0 2px rgba(255,255,255,.08),
        inset 0 0 30px rgba(255,255,255,.08);
      transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
    }
    .play-btn:hover{ transform: translateY(-2px) scale(1.02); }
    .play-btn:active{ transform: translateY(0) scale(.98); }
    .play-btn:focus-visible{ outline: 3px solid var(--accent); outline-offset: 4px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .play-btn svg{ width: 80%; height: 80%; display:block; }

    .label{
      font-size: clamp(1.05rem, 1.5vw + .5rem, 1.5rem);
      color: var(--ink-dim);
      letter-spacing: .02em;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
      user-select: none;
    }

   /* 🔊 Pulsing sound hint */
#soundHint {
  font-size: 1.4rem;
  font-weight: bold;
  color: white;
  text-shadow: 0 0 8px rgba(255,255,255,.9), 0 0 14px rgba(0,128,255,.8);
  opacity: .9;
  pointer-events: none;
  animation: pulseGlow 1.6s infinite;
  transition: opacity .6s ease;
}



    @keyframes pulseGlow {
      0%   { text-shadow: 0 0 6px rgba(255,255,255,.8), 0 0 10px rgba(0,128,255,.7); }
      50%  { text-shadow: 0 0 14px rgba(255,255,255,1), 0 0 24px rgba(0,128,255,1); }
      100% { text-shadow: 0 0 6px rgba(255,255,255,.8), 0 0 10px rgba(0,128,255,.7); }
    }

    @media (max-width: 480px){
      .play-btn{ width: 110px; height: 110px; }
    }
  </style>
</head>
<body>
  <!-- 🎵 Background music -->
  <audio id="bgMusic" autoplay loop muted playsinline preload="auto">
    <source src="audio/intro.mp3" type="audio/mpeg">
  </audio>

  <!-- 🔊 Hint -->
  <main class="stage" id="stage">
<div class="center">
  <a class="play-btn" id="play" href="game.html" aria-label="Play">
    <!-- Play icon (triangle) -->
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.12)" stroke-width="2" />
      <polygon points="40,32 72,50 40,68" fill="white" filter="url(#glow)"/>
    </svg>
    <span class="sr-only">Play</span>
  </a>
  <div class="label">Play</div>
  <!-- 🔊 Banner goes here -->
  <div id="soundHint">🔊 Tap anywhere to enable sound</div>
</div>

  </main>

  <noscript>
    <div style="position:fixed;inset:auto 0 0 0;padding:1rem;text-align:center;background:rgba(0,0,0,.6);color:white">
      JavaScript is off. <a href="index.html" style="color:#fff;text-decoration:underline">Continue</a>.
    </div>
  </noscript>

<script>
  const bgMusic = document.getElementById("bgMusic");
  const playBtn = document.getElementById("play");
  const hint    = document.getElementById("soundHint");

  // Start muted autoplay
  window.addEventListener("load", () => {
    bgMusic.play().catch(() => { /* ignore */ });
  });

  // Unlock audio on first gesture
  const unlockAudio = () => {
    bgMusic.play().finally(() => {
      bgMusic.muted = false;
    });
    if (hint) {
      hint.style.opacity = "0";
      setTimeout(() => hint.remove(), 600);
    }
    window.removeEventListener("pointerdown", unlockAudio);
    window.removeEventListener("keydown", unlockAudio);
    window.removeEventListener("touchstart", unlockAudio);
  };
  window.addEventListener("pointerdown", unlockAudio, { once:true });
  window.addEventListener("keydown", unlockAudio, { once:true });
  window.addEventListener("touchstart", unlockAudio, { once:true });

  // Cut music instantly when Play is pressed
  playBtn.addEventListener("click", () => {
    bgMusic.pause();
    bgMusic.currentTime = 0;
  });
</script>
</body>
</html>
