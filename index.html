<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Who Wants to Be a Millionaire — MSK Ultrasound Pathology</title>
  <meta name="description" content="A Millionaire-style quiz focused on ultrasound pathology." />
  <link rel="icon" href="data:,"><!-- silence favicon 404 on GitHub Pages -->
  <style>
    :root{
      --bg:#0b0f1a; --card:#12172a; --ink:#eaf0ff; --muted:#a8b2cc;
      --acc:#6ac2ff; --acc2:#ffd36a; --good:#33d17a; --bad:#ff6b6b; --edge:#2a3567;
      --glow:0 8px 30px rgba(106,194,255,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--ink); background: radial-gradient(1600px 900px at 20% -10%, #182449 0%, #0f1533 40%, #0b0f1a 100%);
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .app{ width:min(1100px, 100%); }
    header{
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;
    }
    header h1{ font-size: clamp(18px, 2.2vw, 24px); margin:0; font-weight:800; letter-spacing:.3px; }
    .controls{ display:flex; gap:8px; flex-wrap:wrap; }
    button, .btn{
      background: linear-gradient(180deg, #1a2345, #101733); color:var(--ink); border:1px solid var(--edge);
      padding:10px 14px; border-radius:999px; cursor:pointer; box-shadow:var(--glow); font-weight:700; letter-spacing:.3px;
      transition:.2s transform, .2s filter, .2s background;
    }
    button:hover{ transform:translateY(-1px); filter:brightness(1.06); }
    button:disabled{ opacity:.5; cursor:not-allowed; }

    .game{ display:grid; grid-template-columns: 1.1fr .9fr; gap:16px; }
    @media (max-width: 900px){ .game{ grid-template-columns: 1fr; } }

    .stage{
      background: linear-gradient(180deg, #12172a, #0f1426); border:1px solid var(--edge); border-radius:18px; padding:16px;
      box-shadow:var(--glow);
    }
    .ladder{
      background: linear-gradient(180deg, #101733, #0d1327); border:1px solid var(--edge); border-radius:18px; padding:16px; box-shadow:var(--glow);
      display:flex; flex-direction:column; gap:10px;
    }
    .ladder h3{ margin:0 0 8px; font-size:16px; color:var(--muted); }
    .rung{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.06); }
    .rung .num{ width:26px; aspect-ratio:1/1; display:grid; place-items:center; border-radius:999px; background:#0c1330; border:1px solid #1f2a58; font-weight:800; font-size:12px; }
    .rung .amount{ font-weight:800; letter-spacing:.4px; }
    .rung.current{ background: linear-gradient(90deg, rgba(106,194,255,.15), transparent); border-color:#3a4ba0; }
    .rung.won{ background: linear-gradient(90deg, rgba(51,209,122,.16), transparent); border-color:#2f8a61; }

    /* Safety net visual markers */
    .rung.safe{
      border-color: rgba(255,211,106,.6);
      background: linear-gradient(90deg, rgba(255,211,106,.12), transparent);
    }
    .rung.safe .amount::after{
      content:"  🛡";
      font-weight:900;
      color:var(--acc2);
    }

    .qbox{ display:flex; flex-direction:column; gap:14px; }
    .question{
      background: linear-gradient(180deg, #0e1530, #0d1226); border:1px solid var(--edge); border-radius:16px; padding:16px; font-size:clamp(16px, 2.4vw, 20px);
      line-height:1.4; font-weight:700; min-height:84px; display:flex; align-items:center; justify-content:center; text-align:center;
    }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }

    .options{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    @media (max-width: 640px){ .options{ grid-template-columns: 1fr; } }
    .option{
      border:1px solid var(--edge); background: linear-gradient(180deg, #0f1733, #0d1329); border-radius:14px; padding:12px; text-align:left;
      display:flex; gap:12px; align-items:center; cursor:pointer; position:relative; overflow:hidden;
    }
    .option .badge{ width:28px; aspect-ratio:1/1; display:grid; place-items:center; border-radius:6px; font-weight:900; background:#0c1330; border:1px solid #1f2a58; }
    .option.correct{ outline:2px solid var(--good); box-shadow:0 0 0 4px rgba(51,209,122,.12) inset; }
    .option.wrong{ outline:2px solid var(--bad); box-shadow:0 0 0 4px rgba(255,107,107,.12) inset; }
    .option.eliminated{ opacity:.5; filter:grayscale(1); pointer-events:none; }
    .option.selected{ border-color:#4560c9; background: linear-gradient(180deg, #121c42, #0f1838); }

    .lifelines{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
    .chip{ padding:8px 12px; border-radius:999px; border:1px dashed #2a3567; background:#0d1430; font-weight:800; cursor:pointer; }
    .chip.used{ opacity:.5; pointer-events:none; text-decoration:line-through; }

    .status{ text-align:center; color:var(--muted); font-size:14px; min-height:20px; }

    .modal{ position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.5); z-index:50; padding:20px; }
    .modal.show{ display:grid; }
    .card{
      max-width:680px; width:100%; background: linear-gradient(180deg, #111935, #0e1430); border:1px solid var(--edge); border-radius:16px; padding:18px; box-shadow:var(--glow);
    }
    .card h3{ margin:0 0 10px; }
    .barrow{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
    .bar{ height:120px; background:linear-gradient(180deg, #1c2752, #0f1736); border:1px solid #2a3567; border-radius:10px; display:flex; align-items:flex-end; justify-content:center; position:relative; }
    .bar span{ position:absolute; bottom:100%; transform:translateY(-4px); font-weight:800; }
    .bar label{ position:absolute; bottom:6px; font-weight:800; color:var(--muted); }

    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:16px; background:#0d1430; border:1px solid var(--edge); color:var(--ink); padding:10px 14px; border-radius:999px; box-shadow:var(--glow); font-weight:700; display:none; }
    .toast.show{ display:block; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Who Wants to Be a Millionaire — <span style="color:var(--acc2)">Ultrasound Pathology</span></h1>
      <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="soundBtn" aria-pressed="false">🔊 Enable Sound</button>
      </div>
    </header>

    <div class="game">
      <section class="stage">
        <div class="qbox">
          <div id="q" class="question">Press <b>Start Game</b> to begin. 15 questions stand between you and £1,000,000.</div>
          <div id="opts" class="options"></div>
          <div class="actions">
            <button id="lockBtn" disabled>Lock Final Answer</button>
            <button id="walkBtn" disabled>Walk Away (£0)</button>
            <div class="lifelines">
              <div class="chip" id="ll5050">50:50</div>
              <div class="chip" id="llAudience">Ask the Audience</div>
              <div class="chip" id="llPhone">Phone a Friend</div>
            </div>
          </div>
          <div class="status" id="status"></div>
        </div>
      </section>

      <aside class="ladder">
        <h3>Prize Ladder</h3>
        <div id="ladder"></div>
      </aside>
    </div>
  </div>

  <!-- Modals -->
  <div id="modalAudience" class="modal" role="dialog" aria-modal="true" aria-labelledby="audTitle">
    <div class="card">
      <h3 id="audTitle">Audience Poll</h3>
      <div class="barrow" id="audBars"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px">
        <button onclick="hideModal('modalAudience')">Close</button>
      </div>
    </div>
  </div>

  <div id="modalPhone" class="modal" role="dialog" aria-modal="true" aria-labelledby="phoneTitle">
    <div class="card">
      <h3 id="phoneTitle">Phone a Friend</h3>
      <p id="phoneText" style="line-height:1.5"></p>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px">
        <button onclick="hideModal('modalPhone')">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Sound is muted by your browser. Click <b>Enable Sound</b> first.</div>

  <!-- Audio elements -->
  <audio id="questionAudio" preload="auto" loop src="audio/question.mp3"></audio>
  <audio id="correctAudio"  preload="auto" src="audio/correct.mp3"></audio>
  <audio id="wrongAudio"    preload="auto" src="audio/wrong.mp3"></audio>
  <audio id="lifelineAudio" preload="auto" src="audio/lifeline.mp3"></audio>

  <script>
    /* ===================== State & Data ===================== */
    const ladderAmts = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
    // SAFETY NET INDICES (0-based): £1,000 ➜ 4, £32,000 ➜ 9
    const safeIndices = [4, 9];

    const questionsBank = [
  // Shoulder (rotator cuff, bursa, ACJ, biceps, adhesive capsulitis)
  { q:"Which ultrasound finding best confirms a full-thickness supraspinatus tear?", a:["Defect traversing bursal to articular surface with fluid at the footprint","Diffuse tendon thickening only","Calcific focus without shadowing","Isolated subacromial bursal fluid"], c:0 },
  { q:"Which feature most suggests a partial-thickness bursal-side supraspinatus tear?", a:["Focal defect on bursal surface with intact articular fibers","Complete tendon retraction","Gap filled with fat in the tendon","Uniform hyperechogenicity of the tendon"], c:0 },
  { q:"Dynamic impingement on subacromial scan is best demonstrated by:", a:["Bursal surface bunching/pain with active abduction or resisted elevation","Absence of power Doppler in the bursa","Non-compressible bursa on probe pressure","Loss of humeral head cortical line"], c:0 },
  { q:"Which finding is most typical of subacromial–subdeltoid bursitis?", a:["Anechoic/complex fluid with synovial hypertrophy and peripheral hyperemia","Calcific foci with clean shadowing only","Uniformly thick hyperechoic bursal wall without fluid","No bursal distension but global tendon hyperemia"], c:0 },
  { q:"Calcific tendinopathy of the rotator cuff on US classically appears as:", a:["Echogenic focus with shadowing ± twinkle artifact","Purely anechoic intratendinous cyst","Heterogeneous mass with central flow","Isoechoic nodule with no artifact"], c:0 },
  { q:"Which scan plane best assesses supraspinatus footprint integrity?", a:["Long-axis footprint view with arm in modified Crass","Short-axis with arm adducted neutral","Oblique axial through bicipital groove","Posterior axial through infraspinatus only"], c:0 },
  { q:"A hallmark of adhesive capsulitis on US is:", a:["Thickened hypoechoic rotator interval/coracohumeral ligament with hyperemia","Massive subacromial bursal fluid","Full-thickness cuff tear in all cases","Large AC joint effusion"], c:0 },
  { q:"Subscapularis full-thickness tear is most strongly indicated by:", a:["Discontinuity at lesser tuberosity with retraction and dynamic biceps instability","Posterior cuff atrophy only","Bursal thickening alone","Normal tendon echotexture with mild Doppler flow"], c:0 },
  { q:"Medial dislocation of the long head of biceps most often accompanies:", a:["Subscapularis tear","Infraspinatus strain","AC joint sprain","Deltoid strain"], c:0 },
  { q:"Which ultrasound sign supports AC joint osteoarthritis causing pain?", a:["Joint space narrowing with osteophytes, capsular thickening, and focal tenderness","Large joint effusion with internal septations","Hypermobile clavicle under dynamic probe pressure","Complete rotator cuff avulsion"], c:0 },

  // Elbow (epicondylitis, UCL, ulnar nerve, triceps/biceps)
  { q:"Typical US appearance of lateral epicondylitis (CEO tendinopathy) is:", a:["Hypoechoic thickened common extensor origin with intrasubstance tears ± neovessels","Uniform hyperechoic origin without Doppler","Complete avulsion in nearly all cases","Normal fibrillar pattern without pain reproduction"], c:0 },
  { q:"Medial epicondylitis usually involves which structure on US?", a:["Flexor-pronator origin with hypoechogenicity and partial tearing","Common extensor origin with calcific change","Triceps tendon insertion thickening only","UCL proximal avulsion exclusively"], c:0 },
  { q:"A high-grade UCL (MCL) tear is suggested by:", a:["Fiber discontinuity with gapping on valgus stress and hyperemia at sublime tubercle","Thick, homogeneous ligament without gapping on stress","Increased echogenicity with no laxity","Joint effusion alone"], c:0 },
  { q:"Ulnar nerve subluxation at the elbow is best demonstrated by:", a:["Dynamic scanning during flexion showing nerve hopping over medial epicondyle","Static enlargement only in extension","Color Doppler aliasing within the nerve","Bone erosion of capitellum"], c:0 },
  { q:"A commonly used CSA threshold for ulnar neuropathy at the elbow is:", a:["≥10 mm² at the medial epicondyle","≥5 mm² at the wrist","≥3 mm² anywhere","≥20 mm² at Guyon’s canal"], c:0 },
  { q:"Distal biceps tendon tear on US typically shows:", a:["Discontinuity at radial tuberosity with retracted tendon and hematoma","Diffuse hyperechoic thickening only","Normal insertion with bursal fluid alone","Increased Doppler within intact tendon"], c:0 },
  { q:"Triceps tendon high-grade tear is suggested by:", a:["Posterior elbow gap with retraction and olecranon enthesopathy/hematoma","Uniform tendon thickening without defect","Isolated joint effusion with intact fibers","Only calcific focus without disruption"], c:0 },
  { q:"A snapping triceps/ulnar nerve phenomenon is best captured by:", a:["Dynamic cine clips during active flexion–extension","Static long-axis imaging in full extension only","Power Doppler at rest","Compression test alone"], c:0 },
  { q:"Olecranon bursitis most commonly appears as:", a:["Anechoic/complex fluid superficial to triceps insertion with possible synovial thickening","Intratendinous cyst within triceps","Cortical step-off at olecranon","Purely solid vascular mass"], c:0 },
  { q:"Radial tunnel syndrome on US may show:", a:["Enlarged hypoechoic PIN with focal compression by fibrous band or vessel","Thickened median nerve at pisiform","Ulnar nerve hourglass deformity at Guyon’s canal","Normal nerve with isolated joint effusion"], c:0 },

  // Wrist/Hand (tendons, pulleys, nerves, TFCC, ganglia)
  { q:"De Quervain tenosynovitis involves which compartment?", a:["1st dorsal (APL/EPB) with sheath thickening and fluid","6th dorsal (ECU) exclusively","3rd dorsal (EPL) with pulley nodules","Flexor carpi ulnaris tunnel"], c:0 },
  { q:"Carpal tunnel syndrome sonographic signs include:", a:["Median nerve CSA ≥10–12 mm², palmar bowing of retinaculum, loss of fascicles","Ulnar nerve enlargement at pisiform","Prominent artery in tunnel as sole sign","Thickened ECU subsheath only"], c:0 },
  { q:"Trigger finger on US is characterized by:", a:["A1 pulley thickening with flexor tendon nodularity and dynamic catching","Ruptured extensor tendon over MCP","Purely bony spur at MCP head","Dorsal ganglion without tendon changes"], c:0 },
  { q:"ECU subsheath tear most likely presents as:", a:["Dynamic ECU subluxation with ulnar deviation/supination","Fixed ECU hyperechogenicity without movement","Median nerve flattening at tunnel inlet","Volar ganglion near STT joint"], c:0 },
  { q:"A dorsal wrist ganglion typically appears as:", a:["Anechoic/weakly septated cyst with posterior enhancement and no internal flow","Solid hyperechoic mass with strong shadowing","Hypervascular solid nodule","Complex mass with arterial flow"], c:0 },
  { q:"TFCC pathology on US is most suggested by:", a:["Hypoechoic cleft/irregularity at ulnar fovea with adjacent fluid and tenderness","Thickened A2 pulley","Hyperemia over Lister’s tubercle","Median nerve fascicular enlargement"], c:0 },
  { q:"Guyon’s canal syndrome is associated with:", a:["Ulnar nerve enlargement/compression by ganglion or artery at the canal","Median nerve bowing under retinaculum","ECU tendon split tear","APL accessory slips"], c:0 },
  { q:"Scapholunate ligament tear may be inferred sonographically by:", a:["Dorsal SL interval widening with dorsal ganglion and pain on probe pressure","Ulnar variance increase alone","Median nerve hyperemia","ECU tenosynovitis alone"], c:0 },
  { q:"Flexor tenosynovitis (infective) hallmark on US:", a:["Anechoic/complex sheath fluid with hyperemic synovial thickening and pain on compression","Clean shadowing intratendinous calcification","Avascular solid mass","Normal tendon glide without fluid"], c:0 },
  { q:"A volar retinacular cyst most commonly arises from:", a:["Flexor tendon sheath near A1 pulley","ECU subsheath","TFCC central disc","Dorsal capsule at SL interval"], c:0 },
  { q:"Intersection syndrome is characterized sonographically by:", a:["Tenosynovitis at crossing of 1st and 2nd dorsal compartments","ECU subsheath laxity only","Median nerve bifurcation","TFCC ulnar styloid avulsion"], c:0 },
  { q:"Wartenberg’s syndrome involves:", a:["Superficial radial nerve entrapment with focal tenderness and positive Tinel","Ulnar nerve Guyon’s canal entrapment","PIN entrapment under supinator","Median nerve compression by lumbricals"], c:0 },
  { q:"A2 pulley rupture looks like:", a:["Bowstringing of flexor tendon with increased tendon-to-bone distance on dynamic flexion","Static hyperechogenic line over phalanx","Isolated joint effusion","Volar plate thickening only"], c:0 },
  { q:"Kienböck disease early changes on US may show:", a:["Dorsal synovitis and tenderness; US is adjunctive to MRI/X-ray","Definite lunate collapse best on US","Median nerve tear","ECU rupture"], c:0 },
  { q:"A mid-substance EPL rupture most often occurs after:", a:["Distal radius fracture with attrition around Lister’s tubercle","Ulnar styloid avulsion","Hook of hamate fracture","Scaphoid tubercle contusion"], c:0 },
  { q:"Dupuytren’s nodules on US usually appear as:", a:["Hypoechoic palmar fascial nodules superficial to flexor tendons ± minimal Doppler","Anechoic cysts with enhancement","Hypervascular intratendinous masses","Bone erosions at MCP"], c:0 },
  { q:"Carpal bossing on US most likely shows:", a:["Osteophyte/dorsal carpometacarpal prominence with adjacent ganglion possible","Hypervascular soft tissue mass only","TFCC central perforation","ECU split tear"], c:0 },
  { q:"Ulnar collateral ligament injury (gamekeeper’s/skier’s thumb) hallmark:", a:["UCL fiber discontinuity ± Stener lesion superficial to adductor aponeurosis","Thickened A1 pulley","Flexor tendon tear at FDP insertion","Median nerve bifid variant"], c:0 },

  // Hip/Pelvis (gluteal tendons, bursae, hamstrings, iliopsoas, hernia)
  { q:"Greater trochanteric pain syndrome commonly shows:", a:["Gluteus medius/minimus tendinopathy ± trochanteric bursitis","Isolated ITB thickening with normal tendons","Femoral head osteonecrosis only","Hip labral tear exclusively"], c:0 },
  { q:"A high-grade gluteus medius tear appears as:", a:["Focal discontinuity at greater trochanter with retraction and fluid","Diffuse hyperemia only","Purely calcific enthesophyte","Uniform thickening without defect"], c:0 },
  { q:"Iliopsoas bursitis on US is best seen:", a:["Medial to femoral vessels as anechoic/complex distended bursa","Posterior to gluteus maximus","Within the labrum","Deep to sartorius at mid-thigh"], c:0 },
  { q:"Snapping iliopsoas is demonstrated by:", a:["Dynamic tendon translation over iliopectineal eminence with audible/palpable snap","Static scan in neutral only","Power Doppler at rest","Bursal aspiration only"], c:0 },
  { q:"Proximal hamstring tendinopathy typically shows:", a:["Thickened hypoechoic origin at ischial tuberosity ± partial tears","Prepatellar effusion","Quadriceps calcific focus","Isolated sciatic nerve enlargement without tendon change"], c:0 },
  { q:"Proximal hamstring avulsion is best indicated by:", a:["Complete fiber discontinuity with retraction and hematoma at ischial tuberosity","Mild peritendinous fluid only","Normal origin with posterior thigh edema","Purely cortical irregularity without defect"], c:0 },
  { q:"Athletic pubalgia (inguinal-related) on US may show:", a:["Rectus abdominis–adductor aponeurotic cleft/tear with focal hyperemia","Hip joint effusion only","Gluteus medius calcification","Isolated trochanteric bursitis"], c:0 },
  { q:"Adductor longus tendinopathy on US:", a:["Hypoechoic thickening at pubic origin ± neovascularity","Purely anechoic bursal fluid lateral hip","Labral tear with paralabral cyst","Femoral head cortical step"], c:0 },
  { q:"Femoral hernia on groin US appears as:", a:["Bulging sac with peristaltic/echogenic fat inferior to inguinal ligament medial to femoral vein","Sac above inguinal ligament lateral to vessels","Intra-articular hip effusion","Sciatic nerve cyst"], c:0 },
  { q:"Meralgia paresthetica correlates sonographically with:", a:["LFCN thickening/hypoechogenicity at ASIS with focal tenderness","Tibial nerve enlargement at tarsal tunnel","Median nerve flattening at wrist","Ulnar nerve hyperemia at elbow"], c:0 },
  { q:"Hip joint effusion in pediatrics is measured between:", a:["Anterior capsule and femoral neck; asymmetry with contralateral side","Acetabular roof and labrum","Greater trochanter and ITB","Iliopsoas and femoral vessels"], c:0 },
  { q:"Iliopsoas tendon tear most commonly occurs at:", a:["Lesser trochanter insertion with focal defect and hematoma","Greater trochanter footprint","ASIS origin","Pubic symphysis"], c:0 },

  // Knee (ligaments, tendons, bursae, meniscus, cysts)
  { q:"Patellar tendinopathy (jumper’s knee) on US:", a:["Hypoechoic thickening of proximal tendon at inferior pole with neovessels","Diffuse quadriceps atrophy only","Purely anechoic prepatellar bursa","Complete tendon rupture universally"], c:0 },
  { q:"Quadriceps tendon tear is suggested by:", a:["Discontinuity proximal to patella with gap/hematoma and suprapatellar fluid","Uniform tendon thickening without defect","ACL fiber discontinuity on US","Isolated MCL thickening"], c:0 },
  { q:"Prepatellar bursitis typically shows:", a:["Anechoic/complex fluid superficial to patella with thickened bursal walls","Fluid deep to MCL only","Meniscal extrusion","Patellar cartilage fissuring"], c:0 },
  { q:"Pes anserine bursitis location on US:", a:["Between MCL and sartorius/gracilis/semitendinosus tendons","Within the ACL sheath","Posterior to LCL only","Deep to quadriceps tendon"], c:0 },
  { q:"MCL high-grade tear appears as:", a:["Fiber disruption with hypoechoic gap and gapping on valgus stress","Uniform hyperechogenic band without laxity","Meniscal cyst only","Suprapatellar fat pad edema alone"], c:0 },
  { q:"LCL tear is best assessed by:", a:["Dynamic varus stress showing gapping with ligament discontinuity","Valgus stress only","Patellar grind test sonography","Static Doppler at rest"], c:0 },
  { q:"Parameniscal cyst on US:", a:["Anechoic/complex cyst abutting meniscus root/rim consistent with underlying tear","Vascular solid mass","Intratendinous patellar lesion","Baker’s cyst only"], c:0 },
  { q:"A Baker’s cyst is located between:", a:["Semimembranosus tendon and medial head of gastrocnemius","Biceps femoris and lateral head of gastrocnemius","Popliteus and fibular head","ITB and lateral femoral condyle"], c:0 },
  { q:"Popliteal cyst rupture can present with:", a:["Calf tracking fluid and subcutaneous edema along fascial planes","Isolated patellar tendon gap","Quadriceps intramuscular hematoma only","Joint line osteophytes"], c:0 },
  { q:"Osgood–Schlatter disease on US shows:", a:["Thickened distal patellar tendon with tibial tubercle fragmentation and Doppler","Meniscal central tear","ACL mid-substance rupture","MCL calcific enthesopathy only"], c:0 },
  { q:"Sinding-Larsen-Johansson typically affects:", a:["Proximal patellar pole apophysis with tendon thickening","Tibial tubercle apophysis","Fibular head apophysis","Medial femoral epicondyle"], c:0 },
  { q:"ITB friction syndrome hallmark:", a:["Thickened distal ITB with focal hypoechogenicity over lateral femoral condyle ± bursal fluid","MCL rupture","Popliteus tear only","Patellar fat pad cyst"], c:0 },
  { q:"Patellar tendon rupture commonly occurs:", a:["At inferior pole/patellar insertion with retraction and hematoma","At quadriceps junction exclusively","At tibial tubercle always","Inside the meniscus"], c:0 },
  { q:"Meniscocapsular separation may be seen as:", a:["Hypoechoic cleft at meniscal periphery with capsular fluid on probe press","Central meniscal extrusion only","Patellar chondromalacia","Baker’s cyst calcification"], c:0 },
  { q:"Popliteus tendon injury on US:", a:["Discontinuity at femoral attachment with posterolateral tenderness","Medial meniscus cyst only","ACL avulsion","MCL thickening without defect"], c:0 },
  { q:"Synovitis in inflammatory arthritis of the knee appears as:", a:["Hypoechoic synovial hypertrophy with power Doppler signal in recesses","Purely anechoic effusion without synovium","Clean shadowing calcification","Isolated prepatellar fluid"], c:0 },

  // Ankle/Foot (ligaments, tendons, plantar fascia, neuroma, tarsal tunnel, stress injury)
  { q:"ATFL complete tear is suggested by:", a:["Fiber discontinuity with laxity on anterior drawer during dynamic US","Isolated CFL thickening","Deltoid ligament calcification only","Normal ATFL with lateral pain"], c:0 },
  { q:"CFL injury evaluation is best with:", a:["Long-axis imaging posterior to lateral malleolus and varus stress","Anterior drawer only","Static short-axis in neutral solely","Palpation without imaging"], c:0 },
  { q:"Deltoid ligament tear presents as:", a:["Medial fiber disruption with talar tilt on dynamic valgus stress","ATFL discontinuity only","Peroneal tendon split","Posterior tibial tenosynovitis alone"], c:0 },
  { q:"Achilles tendinopathy on US typically shows:", a:["Fusiform thickening with hypoechoic areas and neovascularity (mid-portion)","Uniform thinning and anechoic lumen","Complete discontinuity in every case","Only Kager’s fat pad edema"], c:0 },
  { q:"Achilles rupture hallmark:", a:["Complete gap with retracted ends ± hematoma; loss of dynamic fiber continuity","Mild peritendinous fluid only","Isolated hyperechogenicity without gap","Normal tendon with calf pain"], c:0 },

  { q:"Sinus tarsi syndrome US features include:", a:["Hypoechoic scarring/fluid in sinus tarsi with cervical/interosseous ligament injury","Posterior tibial tendon rupture","Deltoid ligament calcification","Achilles mid-portion tear"], c:0 },

  // Systemic/Inflammatory/Infection/Other MSK lumps & bumps

  { q:"Foreign body (wood/glass) usually appears as:", a:["Echogenic linear focus with posterior shadow or twinkle and hypoechoic halo","Anechoic compressible cyst","Vascular solid nodule","Uniform hypoechoic tendon"], c:0 },
  { q:"Intramuscular hematoma on US:", a:["Heterogeneous collection that evolves from echogenic to complex anechoic with time","Always anechoic with strong enhancement day 1","Purely solid hyperechoic mass with flow","Fixed calcified plaque"], c:0 },
  { q:"Muscle strain grade II best correlates with:", a:["Partial fiber disruption with hematoma and weakened contraction on dynamic scan","Complete tendon avulsion","Isolated DOMS with normal US","Only periosteal reaction"], c:0 },
  { q:"Myositis ossificans typical evolution:", a:["Peripheral rim calcification forming around a soft-tissue hematoma (‘zonal’ pattern)","Central lamellar bone first","Immediate uniform echogenic scar","No calcification at any stage"], c:0 },
  { q:"Lipoma on US usually:", a:["Compressible, iso-hyperechoic, avascular lesion aligned parallel to skin","Hypervascular solid mass with necrosis","Anechoic cyst with enhancement","Calcified nodule with clean shadow"], c:0 },
  { q:"Low-flow venous malformation features:", a:["Compressible vascular spaces with phleboliths (echogenic foci with shadow) and slow flow","High-velocity arterial jets with PSV > 150 cm/s","Anechoic bursa with no septa","Bone erosion only"], c:0 },
  { q:"Peripheral nerve traumatic neuroma on US:", a:["Fusiform hypoechoic enlargement at injury site with loss of fascicular definition","Anechoic cyst within joint","Bursal calcification","Intratendinous ganglion"], c:0 },
  { q:"Biceps femoris distal insertion injury shows:", a:["Fiber disruption at fibular head with hematoma and tenderness","ACL mid-substance tear","MCL proximal avulsion","Popliteus tendinopathy only"], c:0 },
  { q:"Sural nerve entrapment may be seen as:", a:["Focal nerve enlargement/hypoechogenicity posterior to lateral malleolus with Tinel sign","Median nerve bowing at wrist","Tibial nerve compression at tarsal tunnel only","Sciatic nerve bifurcation anomaly"], c:0 },
  { q:"Anterior tibialis tendinopathy:", a:["Hypoechoic thickening over ankle dorsum with sheath fluid and pain on resisted dorsiflexion","Peroneal split tear","PTT rupture","Deltoid ligament avulsion"], c:0 },
  { q:"Extensor hallucis longus tear is suggested by:", a:["Discontinuity over first ray with loss of dynamic tension and hematoma","Peroneus longus split","Plantar fascia enthesopathy only","Tibial stress reaction"], c:0 },
  { q:"Pre-Achilles (superficial) bursitis appears:", a:["Fluid superficial to Achilles between skin and tendon at insertion","Deep fluid within Kager’s fat pad","Plantaris tear","Os trigonum edema"], c:0 }
];

    const state = {
      order: [],
      qIndex: -1,
      winningsIndex: -1,
      selected: null,
      currentCorrect: null,
      used: { fifty:false, audience:false, phone:false },
      soundEnabled: false,
      locking: false,
      ended: false
    };

    /* ===================== Helpers ===================== */
    const $  = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    const rand = n => Math.floor(Math.random()*n);
    const shuffle = arr => arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }
    const currentWinnings = () => state.winningsIndex>=0 ? ladderAmts[state.winningsIndex] : 0;

    function buildLadder(){
      const lad = $('#ladder'); lad.innerHTML='';
      ladderAmts.slice().reverse().forEach((amt, iRev)=>{
        const idx = ladderAmts.length-1 - iRev;
        const div = document.createElement('div'); div.className='rung'; div.dataset.idx = idx;
        if (safeIndices.includes(idx)) div.classList.add('safe');
        const num = document.createElement('div'); num.className='num'; num.textContent = String(idx+1);
        const amtEl = document.createElement('div'); amtEl.className='amount'; amtEl.textContent = `£${amt.toLocaleString()}`;
        div.append(num, amtEl); lad.append(div);
      });
      highlightLadder();
    }
    function highlightLadder(){
      $$('#ladder .rung').forEach(r=>{
        const idx = +r.dataset.idx;
        r.classList.toggle('current', !state.ended && idx===state.winningsIndex+1);
        r.classList.toggle('won',     idx<=state.winningsIndex);
      });
      updateWalkBtn();
    }
    function updateWalkBtn(){
      const b = $('#walkBtn');
      b.textContent = `Walk Away (£${currentWinnings().toLocaleString()})`;
      b.disabled = state.qIndex < 0 || state.ended;
    }
    function setStatus(msg=''){ $('#status').innerHTML = msg; }

    /* ===================== Audio (exclusive playback) ===================== */
    let audioCtx = null;
    const AUDIO_IDS = ['questionAudio','correctAudio','wrongAudio','lifelineAudio'];

    function enableSound(){
      if(state.soundEnabled) return;
      try{
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        // tiny blip to unlock autoplay
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.frequency.value = 440; g.gain.value = 0.0001;
        o.connect(g).connect(audioCtx.destination); o.start(); setTimeout(()=>o.stop(), 100);
        state.soundEnabled = true; $('#soundBtn').textContent = '🔇 Disable Sound'; $('#soundBtn').setAttribute('aria-pressed','true');
      }catch(e){ console.warn(e); }
    }
    function disableSound(){ state.soundEnabled=false; $('#soundBtn').textContent ='🔊 Enable Sound'; $('#soundBtn').setAttribute('aria-pressed','false'); stopAllAudio(); }

    function stopTag(id){ const el=document.getElementById(id); if(el){ try{ el.pause(); el.currentTime = 0; }catch{} } }
    function stopAllAudio(){ AUDIO_IDS.forEach(stopTag); }

    function stopAllExcept(keepId){
      AUDIO_IDS.forEach(id=>{ if(id!==keepId) stopTag(id); });
    }

    function playTag(id){
      if(!state.soundEnabled){ toast('Sound is muted by your browser. Click Enable Sound first.'); return Promise.reject('muted'); }
      const el = document.getElementById(id);
      if(!el) return Promise.resolve();
      try{ el.currentTime = 0; const p = el.play(); return p || Promise.resolve(); }
      catch(err){ console.warn('HTML5 audio failed, falling back to synth', err); return synthTone(); }
    }

    // Background (loop) audio — never overlaps with anything else
    function playBg(id){
      stopAllExcept(id);
      return playTag(id);
    }

    // SFX — pause bg, play once, then auto-resume bg if it was playing
    function playSfx(id){
      const bg = document.getElementById('questionAudio');
      const shouldResume = state.soundEnabled && bg && !bg.paused && !bg.ended;
      if(shouldResume){ try{ bg.pause(); }catch{} }
      stopAllExcept(id);

      const el = document.getElementById(id);
      let resumed = false;
      const resume = ()=>{ if(shouldResume && !resumed){ resumed = true; try{ bg.play(); }catch{} } };

      if(el){
        const onend = ()=>{ el.removeEventListener('ended', onend); resume(); };
        el.addEventListener('ended', onend);
      }
      // If playback falls back to synthTone, ensure resume anyway
      return playTag(id).finally(()=> setTimeout(resume, 50));
    }

    function synthTone(type='sine', freq=659, dur=0.4, vol=0.1){
      if(!state.soundEnabled){ return Promise.resolve(); }
      try{
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol;
        o.connect(g).connect(audioCtx.destination); o.start(); 
        return new Promise(res=>{ setTimeout(()=>{ o.stop(); res(); }, dur*1000); });
      }catch(e){ return Promise.resolve(); }
    }

    const sounds = {
      question: ()=> playBg('questionAudio'),
      correct : ()=> playSfx('correctAudio'),
      wrong   : ()=> playSfx('wrongAudio'),
      lifeline: ()=> playSfx('lifelineAudio'),
    };

    /* ===================== Game Flow ===================== */
    function startGame(){
      disableOptions(); state.selected=null; state.used={fifty:false,audience:false,phone:false};
      state.winningsIndex = -1; state.qIndex = -1; state.ended=false;
      buildLadder();
      renderLifelines();
      updateWalkBtn();
      state.order = shuffle(questionsBank).slice(0,15);
      nextQuestion();
      if(state.soundEnabled){ sounds.question(); }
    }

    function renderLifelines(){
      const setUsed=(id,used)=>{ const el=$(id); el.classList.toggle('used', used || state.ended); };
      setUsed('#ll5050', state.used.fifty);
      setUsed('#llAudience', state.used.audience);
      setUsed('#llPhone', state.used.phone);
    }

    function nextQuestion(){
   if(state.qIndex >= state.order.length){
  setStatus(`<b>Congratulations!</b> You won <b>£${ladderAmts[state.winningsIndex]?.toLocaleString()||'1,000,000'}</b>. Click <b>Start Game</b> to play again.`);
  stopAllAudio();
  $('#walkBtn').disabled = true;
  return;
}

state.selected = null;        // ← add this line here

const qObj = state.order[state.qIndex];


// Make a shuffled permutation of indices [0,1,2,3]
const perm = shuffle([0,1,2,3]);
// Build the displayed answers using the permutation
const displayAnswers = perm.map(i => qObj.a[i]);
// Where did the original correct index end up?
state.currentCorrect = perm.indexOf(qObj.c);

// Render options in the new order
const opts = $('#opts'); opts.innerHTML='';
displayAnswers.forEach((text, i)=>{         // i is the *displayed* index now
  const btn = document.createElement('div'); 
  btn.className='option'; 
  btn.dataset.idx=i;                         // displayed index
  btn.innerHTML = `<div class="badge">${'ABCD'[i]}</div><div>${text}</div>`;
  btn.addEventListener('click', ()=>selectOption(i, btn));
  opts.append(btn);
});
      $('#lockBtn').disabled = true; $('#walkBtn').disabled=false;
      setStatus('Pick an option, or <b>Walk Away</b>.');
      highlightLadder();
      $$('#opts .option').forEach(o=>o.classList.remove('eliminated','correct','wrong','selected'));
      if(state.soundEnabled){ stopTag('correctAudio'); stopTag('wrongAudio'); stopTag('lifelineAudio'); sounds.question(); }
    }

    function selectOption(i, el){
      if(state.locking || state.ended) return;
      $$('#opts .option').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      state.selected = i; $('#lockBtn').disabled=false; setStatus('Ready? Click <b>Lock Final Answer</b> or <b>Walk Away</b>.');
    }

    function disableOptions(dis=true){ $$('#opts .option').forEach(o=> o.style.pointerEvents = dis?'none':'auto'); }

function lockAnswer(){
  if(state.selected==null || state.ended) return;
  state.locking = true; 
  disableOptions(true);
  stopTag('questionAudio'); // pause bg before SFX

  const correct = state.currentCorrect;

  // ✅ define selectedEl (was missing)
  const selectedEl = $(`#opts .option[data-idx="${state.selected}"]`);
  if(!selectedEl) return;

  setStatus('Final answer locked...');

  setTimeout(()=>{
    if(state.selected === correct){
      selectedEl.classList.add('correct');
      state.winningsIndex++;
      highlightLadder();

      const wonAmt = ladderAmts[state.winningsIndex];
      if (safeIndices.includes(state.winningsIndex)) {
        setStatus(`<b>Correct!</b> You have won £${wonAmt.toLocaleString()}. <span style="color:var(--acc2);font-weight:800">Safety net reached — guaranteed at least £${wonAmt.toLocaleString()}.</span>`);
      } else {
        setStatus(`<b>Correct!</b> You have won £${wonAmt.toLocaleString()}.`);
      }

      // Play correct.mp3 to completion, then move on
      const proceedNext = () => { 
        state.locking = false; 
        disableOptions(false); 
        nextQuestion(); 
      };
      sounds.correct();
      const correctEl = document.getElementById('correctAudio');
      if (state.soundEnabled && correctEl) {
        correctEl.addEventListener('ended', proceedNext, { once: true });
      } else {
        setTimeout(proceedNext, 1200);
      }

    } else {
      selectedEl.classList.add('wrong');
      const corrEl = $(`#opts .option[data-idx="${correct}"]`);
      if(corrEl) corrEl.classList.add('correct');

      // Let wrong.mp3 finish
      const wrongEl = document.getElementById('wrongAudio');
      if (wrongEl) wrongEl.addEventListener('ended', ()=> stopAllAudio(), { once:true });
      sounds.wrong();

      const safe = safeIndices.slice().reverse().find(i=> i<=state.winningsIndex);
      const amount = (safe==null) ? 0 : ladderAmts[safe];
      setStatus(`<b>Incorrect.</b> You leave with <b>£${amount.toLocaleString()}</b>. Click <b>Start Game</b> to try again.`);

      state.locking=false;
      state.ended=true;
      $('#walkBtn').disabled = true;
      renderLifelines();
      $$('#ladder .rung').forEach(r=> r.classList.remove('current'));
    }
  }, 800);
}


    /* ===================== Walk Away ===================== */
   function walkAway(){
  if(state.qIndex<0 || state.ended) return;
  state.ended = true;

  const amount = currentWinnings();
  setStatus(`You chose to <b>walk away</b> with <b>£${amount.toLocaleString()}</b>. Click <b>Start Game</b> to play again.`);

  // lock the UI
  $('#lockBtn').disabled = true; $('#walkBtn').disabled = true;
  disableOptions(true);
  renderLifelines();
  $$('#ladder .rung').forEach(r=> r.classList.remove('current'));

  // 🎵 celebration: play correct.mp3 to completion
  stopTag('questionAudio');          // ensure bg loop won't resume
  const el = document.getElementById('correctAudio');
  sounds.correct();                  // plays audio/correct.mp3 (via playSfx)

  if (state.soundEnabled && el) {
    el.addEventListener('ended', ()=> stopAllAudio(), { once:true });
  } else {
    setTimeout(()=> stopAllAudio(), 1200); // fallback if audio can't fire 'ended'
  }
}

    /* ===================== Lifelines ===================== */
  function use5050(){
  if(state.used.fifty || state.qIndex<0 || state.ended) return;
  state.used.fifty = true; 
  renderLifelines(); 
  sounds.lifeline();

  const correct = state.currentCorrect;
  const wrongs = [0,1,2,3].filter(i=> i !== correct);

  // ✅ create toRemove
  const toRemove = shuffle(wrongs).slice(0,2);

  toRemove.forEach(i=>{
    const el = $(`#opts .option[data-idx="${i}"]`);
    if(el) el.classList.add('eliminated');
  });
}

    function useAudience(){
      if(state.used.audience || state.qIndex<0 || state.ended) return; state.used.audience=true; renderLifelines(); sounds.lifeline();
      const correct = state.currentCorrect;
      let base = [rand(40)+10, rand(40)+10, rand(40)+10, rand(40)+10];
      const sum = base.reduce((a,b)=>a+b,0); base = base.map(v=> Math.round(v*100/sum));
      const maxIdx = base.indexOf(Math.max(...base));
      if(maxIdx !== correct){ const tmp = base[correct]; base[correct] = Math.max(...base)+rand(10); base[maxIdx] = tmp - rand(5); }
      let total = base.reduce((a,b)=>a+b,0); const diff = 100-total; base[correct]+=diff;
      const bars = $('#audBars'); bars.innerHTML='';
      base.forEach((p,i)=>{
        const div=document.createElement('div'); div.className='bar'; div.innerHTML=`<span>${p}%</span><label>${'ABCD'[i]}</label>`; div.style.height='140px';
        const inner=document.createElement('div'); inner.style.height=p+'%'; inner.style.width='100%'; inner.style.background='linear-gradient(180deg, #2d72d6, #1c3c9e)'; inner.style.borderRadius='10px'; inner.style.alignSelf='flex-end';
        div.appendChild(inner); bars.append(div);
      });
      showModal('modalAudience');
    }

    function usePhone(){
      if(state.used.phone || state.qIndex<0 || state.ended) return; state.used.phone=true; renderLifelines(); sounds.lifeline();
      const correctLetter = 'ABCD'[state.currentCorrect];
      const confident = Math.random()<0.75;
      const guess = confident? correctLetter : 'ABCD'.replace(correctLetter,'')[rand(3)];
      const confidence = confident? (70+rand(26)) : (40+rand(20));
      $('#phoneText').innerHTML = `"Hi! I don't have long, but I'd go with <b>${guess}</b> and I'm about <b>${confidence}%</b> confident."`;
      showModal('modalPhone');
    }

    function showModal(id){ if(!state.ended) $('#'+id).classList.add('show'); }
    function hideModal(id){ $('#'+id).classList.remove('show'); }

    /* ===================== Wire Up ===================== */
    buildLadder();
    $('#startBtn').addEventListener('click', ()=>{ enableSound(); startGame(); });
    $('#lockBtn').addEventListener('click', lockAnswer);
    $('#walkBtn').addEventListener('click', walkAway);
    $('#ll5050').addEventListener('click', use5050);
    $('#llAudience').addEventListener('click', useAudience);
    $('#llPhone').addEventListener('click', usePhone);

    $('#soundBtn').addEventListener('click', ()=>{
      if(!state.soundEnabled){ enableSound(); }
      else{ disableSound(); }
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e)=>{
      if(['1','2','3','4'].includes(e.key)){
        const idx = +e.key - 1; const el = $(`#opts .option[data-idx="${idx}"]`); if(el) selectOption(idx, el);
      }else if(e.key.toLowerCase()==='l'){ if(!$('#lockBtn').disabled) lockAnswer(); }
      else if(e.key.toLowerCase()==='w'){ if(!$('#walkBtn').disabled) walkAway(); }
    });

    // Accessibility: clicking anywhere on option also selects
    $('#opts').addEventListener('click', (e)=>{
      const opt = e.target.closest('.option'); if(opt){ selectOption(+opt.dataset.idx, opt); }
    });

    // Tip on first load
    setTimeout(()=>{ setStatus('Tip: Click <b>Enable Sound</b> so your browser allows the question music to play.'); }, 800);
  </script>
