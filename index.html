<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Who Wants to Be a Millionaire — Ultrasound Pathology</title>
  <meta name="description" content="A Millionaire-style quiz focused on ultrasound pathology." />
  <link rel="icon" href="data:,"><!-- silence favicon 404 on GitHub Pages -->
  <style>
    :root{
      --bg:#0b0f1a; --card:#12172a; --ink:#eaf0ff; --muted:#a8b2cc;
      --acc:#6ac2ff; --acc2:#ffd36a; --good:#33d17a; --bad:#ff6b6b; --edge:#2a3567;
      --glow:0 8px 30px rgba(106,194,255,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--ink); background: radial-gradient(1600px 900px at 20% -10%, #182449 0%, #0f1533 40%, #0b0f1a 100%);
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .app{ width:min(1100px, 100%); }
    header{
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;
    }
    header h1{ font-size: clamp(18px, 2.2vw, 24px); margin:0; font-weight:800; letter-spacing:.3px; }
    .controls{ display:flex; gap:8px; flex-wrap:wrap; }
    button, .btn{
      background: linear-gradient(180deg, #1a2345, #101733); color:var(--ink); border:1px solid var(--edge);
      padding:10px 14px; border-radius:999px; cursor:pointer; box-shadow:var(--glow); font-weight:700; letter-spacing:.3px;
      transition:.2s transform, .2s filter, .2s background;
    }
    button:hover{ transform:translateY(-1px); filter:brightness(1.06); }
    button:disabled{ opacity:.5; cursor:not-allowed; }

    .game{
      display:grid; grid-template-columns: 1.1fr .9fr; gap:16px;
    }
    @media (max-width: 900px){ .game{ grid-template-columns: 1fr; } }

    .stage{
      background: linear-gradient(180deg, #12172a, #0f1426); border:1px solid var(--edge); border-radius:18px; padding:16px;
      box-shadow:var(--glow);
    }
    .ladder{
      background: linear-gradient(180deg, #101733, #0d1327); border:1px solid var(--edge); border-radius:18px; padding:16px; box-shadow:var(--glow);
      display:flex; flex-direction:column; gap:10px;
    }
    .ladder h3{ margin:0 0 8px; font-size:16px; color:var(--muted); }
    .rung{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.06); }
    .rung .num{ width:26px; aspect-ratio:1/1; display:grid; place-items:center; border-radius:999px; background:#0c1330; border:1px solid #1f2a58; font-weight:800; font-size:12px; }
    .rung .amount{ font-weight:800; letter-spacing:.4px; }
    .rung.current{ background: linear-gradient(90deg, rgba(106,194,255,.15), transparent); border-color:#3a4ba0; }
    .rung.won{ background: linear-gradient(90deg, rgba(51,209,122,.16), transparent); border-color:#2f8a61; }

    .qbox{ display:flex; flex-direction:column; gap:14px; }
    .question{
      background: linear-gradient(180deg, #0e1530, #0d1226); border:1px solid var(--edge); border-radius:16px; padding:16px; font-size:clamp(16px, 2.4vw, 20px);
      line-height:1.4; font-weight:700; position:relative; min-height:84px; display:flex; align-items:center; justify-content:center; text-align:center;
    }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }

    .options{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    @media (max-width: 640px){ .options{ grid-template-columns: 1fr; } }
    .option{
      border:1px solid var(--edge); background: linear-gradient(180deg, #0f1733, #0d1329); border-radius:14px; padding:12px; text-align:left;
      display:flex; gap:12px; align-items:center; cursor:pointer; position:relative; overflow:hidden;
    }
    .option .badge{ width:28px; aspect-ratio:1/1; display:grid; place-items:center; border-radius:6px; font-weight:900; background:#0c1330; border:1px solid #1f2a58; }
    .option.correct{ outline:2px solid var(--good); box-shadow:0 0 0 4px rgba(51,209,122,.12) inset; }
    .option.wrong{ outline:2px solid var(--bad); box-shadow:0 0 0 4px rgba(255,107,107,.12) inset; }
    .option.eliminated{ opacity:.5; filter:grayscale(1); pointer-events:none; }
    .option.selected{ border-color:#4560c9; background: linear-gradient(180deg, #121c42, #0f1838); }

    .lifelines{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
    .chip{ padding:8px 12px; border-radius:999px; border:1px dashed #2a3567; background:#0d1430; font-weight:800; cursor:pointer; }
    .chip.used{ opacity:.5; pointer-events:none; text-decoration:line-through; }

    .status{ text-align:center; color:var(--muted); font-size:14px; min-height:20px; }

    .modal{ position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.5); z-index:50; padding:20px; }
    .modal.show{ display:grid; }
    .card{
      max-width:680px; width:100%; background: linear-gradient(180deg, #111935, #0e1430); border:1px solid var(--edge); border-radius:16px; padding:18px; box-shadow:var(--glow);
    }
    .card h3{ margin:0 0 10px; }
    .barrow{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
    .bar{ height:120px; background:linear-gradient(180deg, #1c2752, #0f1736); border:1px solid #2a3567; border-radius:10px; display:flex; align-items:flex-end; justify-content:center; position:relative; }
    .bar span{ position:absolute; bottom:100%; transform:translateY(-4px); font-weight:800; }
    .bar label{ position:absolute; bottom:6px; font-weight:800; color:var(--muted); }

    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:16px; background:#0d1430; border:1px solid var(--edge); color:var(--ink); padding:10px 14px; border-radius:999px; box-shadow:var(--glow); font-weight:700; display:none; }
    .toast.show{ display:block; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Who Wants to Be a Millionaire — <span style="color:var(--acc2)">Ultrasound Pathology</span></h1>
      <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="soundBtn" aria-pressed="false">🔊 Enable Sound</button>
      </div>
    </header>

    <div class="game">
      <section class="stage">
        <div class="qbox">
          <div id="q" class="question">Press <b>Start Game</b> to begin. 15 questions stand between you and £1,000,000.</div>
          <div id="opts" class="options"></div>
          <div class="actions">
            <button id="lockBtn" disabled>Lock Final Answer</button>
            <div class="lifelines">
              <div class="chip" id="ll5050">50:50</div>
              <div class="chip" id="llAudience">Ask the Audience</div>
              <div class="chip" id="llPhone">Phone a Friend</div>
            </div>
          </div>
          <div class="status" id="status"></div>
        </div>
      </section>

      <aside class="ladder">
        <h3>Prize Ladder</h3>
        <div id="ladder"></div>
      </aside>
    </div>
  </div>

  <!-- Modals -->
  <div id="modalAudience" class="modal" role="dialog" aria-modal="true" aria-labelledby="audTitle">
    <div class="card">
      <h3 id="audTitle">Audience Poll</h3>
      <div class="barrow" id="audBars"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px">
        <button onclick="hideModal('modalAudience')">Close</button>
      </div>
    </div>
  </div>

  <div id="modalPhone" class="modal" role="dialog" aria-modal="true" aria-labelledby="phoneTitle">
    <div class="card">
      <h3 id="phoneTitle">Phone a Friend</h3>
      <p id="phoneText" style="line-height:1.5"></p>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px">
        <button onclick="hideModal('modalPhone')">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Sound is muted by your browser. Click <b>Enable Sound</b> first.</div>

  <!-- Audio elements (use your own files in /audio to replace these). Fallback synth plays if loading fails. -->
  <audio id="questionAudio" preload="auto" loop src="audio/question.mp3"></audio>
  <audio id="correctAudio" preload="auto" src="audio/correct.mp3"></audio>
  <audio id="wrongAudio" preload="auto" src="audio/wrong.mp3"></audio>
  <audio id="lifelineAudio" preload="auto" src="audio/lifeline.mp3"></audio>

  <script>
    /* ===================== State & Data ===================== */
    const ladderAmts = [
      100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000
    ];
    const safeIndices = [4, 9]; // £1,000 and £32,000 safeties (0‑based)

    const questionsBank = [
      // 1

      },
      // 2
      {

      },
      // 3

      // 4
      {
        q: "In the FAST exam, Morison's pouch refers to which space?",

      // 5
      {

      // 6

      // 9
      {
        q: "A common threshold for median nerve cross-sectional area diagnosing carpal tunnel syndrome (at the pisiform) is:",

      // 12

        c: 0
      },
      // 13
      {
        q: "Hepatic steatosis is classically seen as:",

      // 14

      // 16

      // 17

      // 18

      // 19

      },
      // 25
      {
        q: "Typical ultrasound features of lateral epicondylitis include:",
        a: ["Hypoechoic thickened common extensor origin with intrasubstance tears and neovascularity", "Only calcified enthesophytes with normal tendon", "Normal fibrillar pattern without hyperemia", "Complete tendon avulsion in all cases"],
        c: 0
      },
      // 26
      {
        q: "De Quervain tenosynovitis most commonly involves which tendons?",
        a: ["Abductor pollicis longus (APL) and extensor pollicis brevis (EPB)", "Extensor carpi ulnaris and extensor digitorum", "Flexor pollicis longus and flexor digitorum superficialis", "Abductor pollicis longus and extensor pollicis longus (EPL)"],

      },
      // 27
      {
        q: "Which structure forms the roof of the carpal tunnel?",
        a: ["Transverse carpal ligament (flexor retinaculum)", "Palmar aponeurosis", "Carpal bones", "Pisohamate ligament"],

      },
      // 28
      {
        q: "Which ultrasound appearance is typical of cellulitis?",

        q: "An appendicolith on ultrasound appears as:",

      },
      // 30
      {
        q: "A simple ovarian cyst is characterized by:",

      // 31

      },

        q: "Which ultrasound/sign combination is most typical of a kidney stone?",
        a: ["Echogenic focus with strong shadowing and \"twinkle\" artifact on color Doppler", "Anechoic simple cyst with enhancement", "Hypoechoic mass with central flow", "Isoechoic lesion without artifacts"],

      },
      // 35
      {
        q: "Which patient positioning best exposes the supraspinatus footprint for ultrasound?",

      // 36

        q: "For most MSK ultrasound, the most appropriate transducer is:",

      {

      {

      // 48
      {

        c: 0
      },
      // 49
      {
        q: "Compared with gallstones, gallbladder polyps typically:",
        a: ["Do not shadow and are non-mobile", "Produce clean posterior shadowing and are mobile", "Are purely anechoic", "Always exceed 1 cm"],
        c: 0
      },
      // 50
      {
        q: "Standard compression ultrasound for DVT is performed:",
        a: ["In transverse, compressing every ~2 cm along femoral and popliteal veins until walls coapt", "In long-axis only without compression", "Only with color Doppler without compression", "At the ankle veins only"],
        c: 0
      }
    ];

    const state = {
      order: [],
      qIndex: -1,
      winningsIndex: -1,
      selected: null,
      used: { fifty:false, audience:false, phone:false },
      soundEnabled: false,
      locking: false
    };

    /* ===================== Helpers ===================== */
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    const rand = (n) => Math.floor(Math.random()*n);
    const shuffle = arr => arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

    function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }

    function buildLadder(){
      const lad = $('#ladder'); lad.innerHTML='';
      ladderAmts.slice().reverse().forEach((amt, iRev)=>{
        const idx = ladderAmts.length-1 - iRev; // real index
        const div = document.createElement('div');
        div.className='rung';
        div.dataset.idx = idx;
        const num = document.createElement('div'); num.className='num'; num.textContent = String(idx+1);
        const amtEl = document.createElement('div'); amtEl.className='amount'; amtEl.textContent = `£${amt.toLocaleString()}`;
        div.append(num, amtEl); lad.append(div);
      });
      highlightLadder();
    }
    function highlightLadder(){
      $$('#ladder .rung').forEach(r=>{
        const idx = +r.dataset.idx;
        r.classList.toggle('current', idx===state.winningsIndex+1);
        r.classList.toggle('won', idx<=state.winningsIndex);
      });
    }

    function setStatus(msg=''){ $('#status').innerHTML = msg; }

    /* ===================== Audio ===================== */
    let audioCtx = null;

    function enableSound(){
      if(state.soundEnabled) return;
      try{
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.frequency.value = 440; g.gain.value = 0.0001; // almost silent blip to unlock
        o.connect(g).connect(audioCtx.destination); o.start(); setTimeout(()=>o.stop(), 100);
        state.soundEnabled = true; $('#soundBtn').textContent = '🔇 Disable Sound'; $('#soundBtn').setAttribute('aria-pressed','true');
      }catch(e){ console.warn(e); }
    }
    function disableSound(){ state.soundEnabled=false; $('#soundBtn').textContent ='🔊 Enable Sound'; $('#soundBtn').setAttribute('aria-pressed','false'); stopAllAudio(); }

    function playTag(id){
      if(!state.soundEnabled){ toast('Sound is muted by your browser. Click Enable Sound first.'); return Promise.reject('muted'); }
      const el = document.getElementById(id);
      if(!el) return Promise.resolve();
      try{ el.currentTime = 0; const p = el.play(); return p||Promise.resolve(); }
      catch(err){ console.warn('HTML5 audio failed, falling back to synth', err); return synthTone(); }
    }
    function stopTag(id){ const el=document.getElementById(id); if(el){ try{ el.pause(); }catch{} } }
    function stopAllAudio(){ ['introAudio','questionAudio','correctAudio','wrongAudio','lifelineAudio'].forEach(stopTag); }

    function synthTone(type='sine', freq=659, dur=0.4, vol=0.1){
      if(!state.soundEnabled){ return Promise.resolve(); }
      try{
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol;
        o.connect(g).connect(audioCtx.destination); o.start(); return new Promise(res=>{ setTimeout(()=>{ o.stop(); res(); }, dur*1000); });
      }catch(e){ return Promise.resolve(); }
    }

    const sounds = {
      question: ()=> playTag('questionAudio').catch(()=> synthTone('triangle', 392, 0.4, 0.04)),
      correct: ()=> playTag('correctAudio').catch(()=> synthTone('sine', 880, 0.35, 0.08)),
      wrong: ()=> playTag('wrongAudio').catch(()=> synthTone('square', 140, 0.5, 0.08)),
      lifeline: ()=> playTag('lifelineAudio').catch(()=> synthTone('triangle', 523, 0.6, 0.06)),
    };

    /* ===================== Game Flow ===================== */
    function startGame(){
      disableOptions(); state.selected=null; state.used={fifty:false,audience:false,phone:false};
      state.winningsIndex = -1; state.qIndex = -1; buildLadder();
      $$('#opts').forEach(()=>{}); renderLifelines();
      state.order = shuffle(questionsBank).slice(0,15);
      nextQuestion();
      if(state.soundEnabled){ sounds.intro(); setTimeout(()=>{ sounds.question(); }, 1200); }
    }

    function renderLifelines(){
      const setUsed=(id,used)=>{ const el=$(id); el.classList.toggle('used', used); };
      setUsed('#ll5050', state.used.fifty);
      setUsed('#llAudience', state.used.audience);
      setUsed('#llPhone', state.used.phone);
    }

    function nextQuestion(){
      state.qIndex++;
      if(state.qIndex >= state.order.length){
        setStatus(`<b>Congratulations!</b> You won <b>£${ladderAmts[state.winningsIndex]?.toLocaleString()||'1,000,000'}</b>. Click <b>Start Game</b> to play again.`);
        stopAllAudio();
        return;
      }
      const qObj = state.order[state.qIndex];
      $('#q').textContent = `Q${state.qIndex+1}. ${qObj.q}`;
      const opts = $('#opts'); opts.innerHTML='';
      qObj.a.forEach((text, i)=>{
        const btn = document.createElement('div'); btn.className='option'; btn.dataset.idx=i;
        btn.innerHTML = `<div class="badge">${'ABCD'[i]}</div><div>${text}</div>`;
        btn.addEventListener('click', ()=>selectOption(i, btn));
        opts.append(btn);
      });
      $('#lockBtn').disabled = true; setStatus('Pick an option.');
      highlightLadder();
      // reset 50:50 eliminations
      $$('#opts .option').forEach(o=>o.classList.remove('eliminated','correct','wrong','selected'));
      if(state.soundEnabled){ stopTag('introAudio'); stopTag('correctAudio'); stopTag('wrongAudio'); sounds.question(); }
    }

    function selectOption(i, el){
      if(state.locking) return;
      $$('#opts .option').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      state.selected = i; $('#lockBtn').disabled=false; setStatus('Ready? Click <b>Lock Final Answer</b>.');
    }

    function disableOptions(dis=true){ $$('#opts .option').forEach(o=> o.style.pointerEvents = dis?'none':'auto'); }

    function lockAnswer(){
      if(state.selected==null) return;
      state.locking = true; disableOptions(true); stopTag('questionAudio');
      const qObj = state.order[state.qIndex];
      const correct = qObj.c;
      const selectedEl = $(`#opts .option[data-idx="${state.selected}"]`);
      if(!selectedEl) return;
      // suspense
      setStatus('Final answer locked...');
      // After a short suspense, reveal
      setTimeout(()=>{
        if(state.selected === correct){
          selectedEl.classList.add('correct');
          state.winningsIndex++;
          highlightLadder();
          setStatus(`<b>Correct!</b> You have won £${ladderAmts[state.winningsIndex].toLocaleString()}.`);
          sounds.correct();
          setTimeout(()=>{ state.locking=false; disableOptions(false); nextQuestion(); }, 1400);
        }else{
          selectedEl.classList.add('wrong');
          const corrEl = $(`#opts .option[data-idx="${correct}"]`); if(corrEl) corrEl.classList.add('correct');
          sounds.wrong();
          const safe = safeIndices.slice().reverse().find(i=> i<=state.winningsIndex) ?? -1;
          const amount = safe<0 ? 0 : ladderAmts[safe];
          setStatus(`<b>Incorrect.</b> You leave with <b>£${amount.toLocaleString()}</b>. Click <b>Start Game</b> to try again.`);
          state.locking=false;
        }
      }, 800);
    }

    /* ===================== Lifelines ===================== */
    function use5050(){
      if(state.used.fifty || state.qIndex<0) return; state.used.fifty=true; renderLifelines(); sounds.lifeline();
      const qObj = state.order[state.qIndex]; const correct = qObj.c;
      const wrongs = [0,1,2,3].filter(i=>i!==correct); const toRemove = shuffle(wrongs).slice(0,2);
      toRemove.forEach(i=>{ const el = $(`#opts .option[data-idx="${i}"]`); if(el) el.classList.add('eliminated'); });
    }

    function useAudience(){
      if(state.used.audience || state.qIndex<0) return; state.used.audience=true; renderLifelines(); sounds.lifeline();
      const qObj = state.order[state.qIndex]; const correct = qObj.c;
      // Generate plausible distribution
      let base = [rand(40)+10, rand(40)+10, rand(40)+10, rand(40)+10];
      const sum = base.reduce((a,b)=>a+b,0); base = base.map(v=> Math.round(v*100/sum));
      // Ensure correct is highest
      const maxIdx = base.indexOf(Math.max(...base));
      if(maxIdx !== correct){ const tmp = base[correct]; base[correct] = Math.max(...base)+rand(10); base[maxIdx] = tmp - rand(5); }
      // Re-normalize to 100
      let total = base.reduce((a,b)=>a+b,0); const diff = 100-total; base[correct]+=diff;
      const bars = $('#audBars'); bars.innerHTML='';
      base.forEach((p,i)=>{
        const div=document.createElement('div'); div.className='bar'; div.innerHTML=`<span>${p}%</span><label>${'ABCD'[i]}</label>`; div.style.height='140px';
        const inner=document.createElement('div'); inner.style.height=p+'%'; inner.style.width='100%'; inner.style.background='linear-gradient(180deg, #2d72d6, #1c3c9e)'; inner.style.borderRadius='10px'; inner.style.alignSelf='flex-end';
        div.appendChild(inner); bars.append(div);
      });
      showModal('modalAudience');
    }

    function usePhone(){
      if(state.used.phone || state.qIndex<0) return; state.used.phone=true; renderLifelines(); sounds.lifeline();
      const correctLetter = 'ABCD'[state.order[state.qIndex].c];
      const confident = Math.random()<0.75; // friend is right 75% of the time
      const guess = confident? correctLetter : 'ABCD'.replace(correctLetter,'')[rand(3)];
      const confidence = confident? (70+rand(26)) : (40+rand(20));
      $('#phoneText').innerHTML = `"Hi! I don't have long, but I'd go with <b>${guess}</b> and I'm about <b>${confidence}%</b> confident."`;
      showModal('modalPhone');
    }

    function showModal(id){ $('#'+id).classList.add('show'); }
    function hideModal(id){ $('#'+id).classList.remove('show'); }

    /* ===================== Wire Up ===================== */
    buildLadder();
    $('#startBtn').addEventListener('click', ()=>{ enableSound(); startGame(); });
    $('#lockBtn').addEventListener('click', lockAnswer);
    $('#ll5050').addEventListener('click', use5050);
    $('#llAudience').addEventListener('click', useAudience);
    $('#llPhone').addEventListener('click', usePhone);

    $('#soundBtn').addEventListener('click', ()=>{
      if(!state.soundEnabled){ enableSound(); }
      else{ disableSound(); }
    });
    $('#introBtn').addEventListener('click', ()=>{ enableSound(); sounds.intro(); });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e)=>{
      if(['1','2','3','4'].includes(e.key)){
        const idx = +e.key - 1; const el = $(`#opts .option[data-idx="${idx}"]`); if(el) selectOption(idx, el);
      }else if(e.key.toLowerCase()==='l'){ if(!$('#lockBtn').disabled) lockAnswer(); }
    });

    // Accessibility: clicking anywhere on option also selects
    $('#opts').addEventListener('click', (e)=>{
      const opt = e.target.closest('.option'); if(opt){ selectOption(+opt.dataset.idx, opt); }
    });

    // Helpful tip on first load
    setTimeout(()=>{
      setStatus('Tip: Click <b>Enable Sound</b> (or Start) so your browser allows the intro and question music to play.');
    }, 800);
  </script>
</body>
</html>
